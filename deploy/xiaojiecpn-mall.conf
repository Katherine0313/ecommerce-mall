# 杰米商城 Web 端 Nginx 配置
# 放到 /www/server/panel/vhost/nginx/extension/xiaojiecpn.com/mall.conf
# 主配置 html_xiaojiecpn.com.conf 已经 include 该目录

# 同源代理到 Spring Cloud 网关，避免跨域
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # AI 客服 SSE 流式输出需要关闭缓冲
    proxy_buffering off;
}

# 商品图 / 分类图
location ^~ /image/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 用户头像等上传文件
location ^~ /upload/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Vue Router history 模式：刷新 /product/1 这类子路由不 404
location / {
    try_files $uri $uri/ /index.html;
}
